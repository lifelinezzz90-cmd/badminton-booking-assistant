<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="t d"><title id="t">Sanitized Badminton Booking Assistant dashboard</title><desc id="d">Fictional booking plan and task status without personal information.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbf9"/><stop offset="1" stop-color="#e7f5ed"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#173d31" flood-opacity=".10"/></filter></defs><rect width="1440" height="860" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif" fill="#153329"><rect x="64" y="38" width="1312" height="74" rx="22" fill="#fff" filter="url(#shadow)"/><circle cx="105" cy="75" r="23" fill="#e5f7ee"/><path d="M99 57c15 0 25 10 25 22 0 8-5 15-12 19l-6-9c5-3 8-6 8-11 0-6-6-11-15-11V57Z" fill="#147a57"/><text x="143" y="71" font-size="21" font-weight="700">Badminton Booking Assistant</text><text x="143" y="93" font-size="13" fill="#6a8178">本地状态面板 · 示例数据</text><rect x="1238" y="57" width="104" height="36" rx="18" fill="#e5f7ee"/><text x="1262" y="80" font-size="14" font-weight="700" fill="#147a57">运行正常</text>
