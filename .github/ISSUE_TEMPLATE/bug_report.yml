name: Bug report
description: Report a reproducible defect without including private data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not paste accounts, email addresses, tokens, cookies, DPAPI files, local paths, or unredacted logs."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Affected command
      options: [setup, doctor, schedule, status, config, dashboard, uninstall, booking runner]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Redacted reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
